port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - "rule-set:fakeipfilter_domain"
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 📹 YouTube
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🍀 Google
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🤖 ChatGPT
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 👨🏿‍💻 GitHub
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🐬 OneDrive
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🪟 Microsoft
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🎵 TikTok
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 📲 Telegram
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🎥 NETFLIX
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 💶 PayPal
  type: select
  proxies:
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - ♻️ 自动选择
  - 🌐 全部节点
  - DIRECT
- name: ♻️ 自动选择
  type: url-test
  include-all-proxies: true
  exclude-type: direct
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 20
  empty-fallback: REJECT
- name: 🌐 全部节点
  type: select
  include-all-proxies: true
rules:
- RULE-SET,private_ip,DIRECT,no-resolve
- RULE-SET,private_domain,DIRECT
- DOMAIN-SUFFIX,qichiyu.com,🚀 节点选择
- RULE-SET,ai,🤖 ChatGPT
- RULE-SET,github_domain,👨🏿‍💻 GitHub
- RULE-SET,youtube_domain,📹 YouTube
- RULE-SET,google_domain,🍀 Google
- RULE-SET,onedrive_domain,🐬 OneDrive
- RULE-SET,microsoft_domain,🪟 Microsoft
- RULE-SET,apple_domain,DIRECT
- RULE-SET,tiktok_domain,🎵 TikTok
- RULE-SET,telegram_domain,📲 Telegram
- RULE-SET,netflix_domain,🎥 NETFLIX
- RULE-SET,paypal_domain,💶 PayPal
- RULE-SET,apple_ip,DIRECT
- RULE-SET,google_ip,🍀 Google
- RULE-SET,netflix_ip,🎥 NETFLIX
- RULE-SET,telegram_ip,📲 Telegram
- RULE-SET,geolocation-!cn,🚀 节点选择
- RULE-SET,cn_domain,DIRECT
- RULE-SET,cn_ip,DIRECT
- MATCH,🐟 漏网之鱼
